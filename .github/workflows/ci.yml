name: Testes

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: testes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: Pytest no runner proprio
    runs-on:
      - self-hosted
      - Linux
      - X64
      - vitoria-test
    timeout-minutes: 15

    steps:
      - name: Baixar o codigo do commit
        uses: actions/checkout@v6

      - name: Exibir versao do Python do runner
        run: python3 --version

      - name: Criar ambiente virtual
        run: |
          python3 -m venv .venv-ci
          echo "$GITHUB_WORKSPACE/.venv-ci/bin" >> "$GITHUB_PATH"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Validar script de deploy
        run: sh -n devops/deploy.sh

      - name: Validar migrations em banco vazio
        env:
          DATABASE_URL: sqlite:///./migration_test.db
          SECRET_KEY: migration-test-secret
        run: |
          rm -f migration_test.db
          python -m alembic upgrade head
          python -m alembic current
          rm -f migration_test.db

      - name: Executar testes
        run: python -m pytest -q
