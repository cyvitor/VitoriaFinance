{% for group in card_groups %}<a class="sheet-row card-group-row" href="/cards/{{ group.card.id }}?year={{ selected_year }}&month={{ selected_month }}"><span>{% if group.status.value=='paid' %}<i class="status-check bi bi-check-lg"></i>{% else %}<i class="status-pending">!</i>{% endif %}</span><span class="sheet-day"><i class="bi bi-credit-card"></i></span><span><b>Cartão {{ group.method }} {{ group.card.name }}</b><small>{{ group.count }} gasto{{ 's' if group.count!=1 else '' }} · Clique para detalhar</small></span><span></span><strong class="negative">{{ group.amount|money }}</strong></a>{% endfor %}
